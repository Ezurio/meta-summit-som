    freescale/nitrogen-imx91-smarc-m2-60-sdio-sdio.dtbo \
    freescale/nitrogen-imx91-smarc-m2-60-sdio-uart.dtbo \
    freescale/nitrogen-imx91-smarc-m2-ifx-sdio.dtbo \
    freescale/nitrogen-imx91-smarc-m2-nx6xx-sdio.dtbo \
    freescale/nitrogen-imx91-smarc-m2-ti3xx-sdio.dtbo \
    freescale/nitrogen-imx91-smarc-wifi-ifx.dtbo \
    freescale/nitrogen-imx91-smarc-wifi-nx6xx.dtbo \
    freescale/nitrogen-imx91-smarc-wifi-ti3xx.dtbo \
"

FIT_CONF_DEFAULT_DTB = "nitrogen-imx91-smarc-dvk.dtb"

UBOOT_MACHINE = "nitrogen_imx91_smarc_defconfig"

