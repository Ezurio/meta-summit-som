    freescale/nitrogen-imx91-osm-m-m2-60-sdio-uart.dtbo \
    freescale/nitrogen-imx91-osm-m-m2-ifx-sdio.dtbo \
    freescale/nitrogen-imx91-osm-m-m2-nx6xx-sdio.dtbo \
    freescale/nitrogen-imx91-osm-m-m2-ti3xx-sdio.dtbo \
    freescale/nitrogen-imx91-osm-m-m2-usb.dtbo \
    freescale/nitrogen-imx91-osm-m-wifi-ifx.dtbo \
    freescale/nitrogen-imx91-osm-m-wifi-nx6xx.dtbo \
    freescale/nitrogen-imx91-osm-m-wifi-ti3xx.dtbo \
"

FIT_CONF_DEFAULT_DTB = "nitrogen-imx91-osm-m-dvk.dtb"

