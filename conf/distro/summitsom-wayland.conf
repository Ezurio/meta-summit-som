require summitsom-cmd.conf

DISTRO = "summitsom-wayland"
DISTRO_NAME = "Summit SOM Wayland"

DISTRO_FEATURES += "opengl vulkan wayland pam"

# Prefer the Scarthgap/NXP versions on i.MX; Summit machine includes select
# the newer stack for Genio and Carbon machines.
PREFERRED_VERSION_hwdata:imx-nxp-bsp ??= "0.381"
PREFERRED_VERSION_hwdata:mx6-nxp-bsp ??= "0.381"
PREFERRED_VERSION_hwdata:mx7-nxp-bsp ??= "0.381"
PREFERRED_VERSION_wayland:imx-nxp-bsp ??= "1.22.0"
PREFERRED_VERSION_wayland:mx6-nxp-bsp ??= "1.22.0"
PREFERRED_VERSION_wayland:mx7-nxp-bsp ??= "1.22.0"
PREFERRED_VERSION_wayland-native:imx-nxp-bsp ??= "1.22.0"
PREFERRED_VERSION_wayland-native:mx6-nxp-bsp ??= "1.22.0"
PREFERRED_VERSION_wayland-native:mx7-nxp-bsp ??= "1.22.0"
PREFERRED_VERSION_wayland-protocols:mx6-nxp-bsp ??= "1.32.imx"
PREFERRED_VERSION_wayland-protocols:mx7-nxp-bsp ??= "1.32.imx"
PREFERRED_VERSION_wayland-utils:imx-nxp-bsp ??= "1.2.0"
PREFERRED_VERSION_wayland-utils:mx6-nxp-bsp ??= "1.2.0"
PREFERRED_VERSION_wayland-utils:mx7-nxp-bsp ??= "1.2.0"
