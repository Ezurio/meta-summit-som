require conf/distro/poky.conf

DISTRO = "summitsom-cmd"
DISTRO_NAME = "Summit SOM Command Line"

INIT_MANAGER = "systemd"

DISTRO_FEATURES = "\
    usrmerge \
    largefile \
    xattr \
    ipv4 \
    ipv6 \
    systemd \
    alsa \
    usbhost \
    usbgadget \
    ${@bb.utils.contains('BBFILE_COLLECTIONS', 'summit-radio', 'wifi bluetooth', '', d)} \
    lto \
    "

DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio sysvinit gobject-introspection-data ldconfig"

VIRTUAL-RUNTIME_syslog = ""
VIRTUAL-RUNTIME_base-utils-syslog = ""
VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"

#NO_RECOMMENDATIONS = "1"

GLIBC_GENERATE_LOCALES ?= "C.UTF-8 en_US.UTF-8"
IMAGE_LINGUAS ?= "en-us"

SELECTED_OPTIMIZATION = "-Os -pipe ${DEBUG_FLAGS}"

PACKAGE_CLASSES:summitsom ?= "package_ipk"

PACKAGECONFIG:remove:pn-modemmanager = "vala"

VOLATILE_LOG_DIR = "no"

QEMUVERSION = "8.2%"
