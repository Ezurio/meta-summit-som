# We have a conf and classes directory, add to BBPATH
BBPATH =. "${LAYERDIR}:"

# We have recipes-* directories, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

RFPROS_FILESHARE_AUTH ?= ""

BBFILE_COLLECTIONS += "summit-som"
BBFILE_PATTERN_summit-som = "^${LAYERDIR}/"
BBFILE_PRIORITY_summit-som = "9"

LAYERSERIES_COMPAT_summit-som = "wrynose"

SUMMIT_SOM_KEYS_DIR = "${LAYERDIR}/keys"

SUMMIT_SOM_LAYERDIR = "${LAYERDIR}"

CLOUD_HSM_BACKEND ??= "${@'aws-kms' if any(d.getVar(v) for v in ('AWS_KMS_KEY_ARN', 'AWS_KMS_CSF_KEY_ARN', 'AWS_KMS_IMG_KEY_ARN', 'AWS_KMS_FIT_KEY_ARN', 'AWS_KMS_AHAB_KEY_ARN', 'AWS_KMS_UPDATE_KEY_ARN')) else ''}"
CLOUD_HSM_BACKENDS = "aws-kms"

LICENSE_PATH += "${LAYERDIR}/licenses"

BBFILES_DYNAMIC += " \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx-bsp/recipes-*/*/*.bb \
    fsl-bsp-release:${LAYERDIR}/dynamic-layers/imx-bsp/recipes-*/*/*.bbappend \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/ti-bsp/recipes-*/*/*.bb \
    meta-ti-bsp:${LAYERDIR}/dynamic-layers/ti-bsp/recipes-*/*/*.bbappend \
    summit-radio:${LAYERDIR}/dynamic-layers/summit-radio/recipes-*/*/*.bb \
    summit-radio:${LAYERDIR}/dynamic-layers/summit-radio/recipes-*/*/*.bbappend \
    meta-aws:${LAYERDIR}/dynamic-layers/aws/recipes-*/*/*.bb \
    meta-aws:${LAYERDIR}/dynamic-layers/aws/recipes-*/*/*.bbappend \
    "

BBMASK += " \
    meta-imx-bsp/recipes-core/systemd/systemd_%.bbappend \
    meta-imx-bsp/recipes-core/psplash \
    meta-imx-sdk/recipes-core/systemd \
    "
