CONFIG_AHAB_BOOT=y
CONFIG_USB_GADGET_DOWNLOAD=y
# CONFIG_USB_MASS_STORAGE is not set
# CONFIG_CMD_USB is not set
CONFIG_USB=y
CONFIG_USB_GADGET=y
CONFIG_USB_GADGET_MANUFACTURER="Ezurio"
CONFIG_USB_GADGET_VENDOR_NUM=0x3016
CONFIG_USB_GADGET_PRODUCT_NUM=0x0001
CONFIG_USB_GADGET_OS_DESCRIPTORS=y
CONFIG_CI_UDC=y
CONFIG_ENV_IS_NOWHERE=y
# CONFIG_ENV_IS_IN_FAT is not set
# CONFIG_USB_XHCI_HCD is not set
CONFIG_USB_EHCI_HCD=y
CONFIG_USB_EHCI_MX7=y
# CONFIG_CMD_USB_MASS_STORAGE is not set
CONFIG_USB_FUNCTION_FASTBOOT=y
CONFIG_FASTBOOT_BUF_ADDR=0x90400000
CONFIG_FASTBOOT_UUU_SUPPORT=y
CONFIG_FASTBOOT_OEM_RUN=y
CONFIG_FAT_WRITE=n
CONFIG_SPL_USB_GADGET=y
CONFIG_SPL_USB_SDP_SUPPORT=y
CONFIG_SPL_USB_HOST=y
CONFIG_SPL_POWER_DOMAIN=y
CONFIG_SPL_PHY=y
CONFIG_SPL_NOP_PHY=y
CONFIG_SPL_MAX_SIZE=0x30000
CONFIG_SPL_PAD_TO=0x30000
CONFIG_SPL_SDP_USB_DEV=0
CONFIG_SDP_LOADADDR=0x90400000
